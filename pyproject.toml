[project]
name = "nexo"
version = "0.0.1"
description = "Phase 0 prototype: tree-walking interpreter for the Nexo core"
requires-python = ">=3.12"
dependencies = ["cryptography>=45"]

[project.optional-dependencies]
dev = ["pytest"]
ai-guide = ["tiktoken==0.12.0"]

[project.scripts]
nexo = "nexo.cli:entry"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nexo*"]
exclude = ["nexo.web_tools.node_modules*"]

[tool.setuptools.package-data]
nexo = ["stdlib/*.json", "web_runtime.js", "web_hydrate.js", "web_m6.js", "web_wasm_worker.js", "web_keyed.js", "web_router.js", "web_data.js", "web_observe.js", "web_tools/*.mjs", "web_tools/*.json", "web_tools/*.nexo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
