[package]
name = "nexoc"
description = "The Nexo compiler: lexer, parser, checker and LLVM code generation"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nexo"
path = "src/main.rs"

[dependencies]
nexo-diag = { path = "../diag" }
nexo-runtime = { path = "../runtime" }
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
getrandom = "0.2"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }
