name: Shield security regressions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: security (${{ matrix.suite }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Isolated runners avoid shared ports/files between Python shards.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: python, shard: 0}
          - {suite: python, shard: 1}
          - {suite: python, shard: 2}
          - {suite: python, shard: 3}
          - {suite: conformance, shard: 0}
          - {suite: differential, shard: 0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install interpreter and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify native prerequisites
        run: |
          cargo --version
          clang --version
      - name: Build and test Rust
        working-directory: compiler
        run: |
          cargo build --locked
          if [ "${{ matrix.suite }}" = python ] && [ "${{ matrix.shard }}" = 0 ]; then
            cargo test --locked
          fi
      - name: Full Python suite in both backends
        if: matrix.suite == 'python'
        run: python scripts/ci/pytest_shard.py ${{ matrix.shard }} 4 -v --durations=30 -o faulthandler_timeout=300
      - name: Compiler conformance
        if: matrix.suite == 'conformance'
        run: python -u compiler/scripts/conformance.py
      - name: Interpreter/compiler differential checks
        if: matrix.suite == 'differential'
        run: python -u compiler/scripts/differential.py

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Build production image
        run: docker/shield/build.sh runtime
      - name: Verify actual container hardening
        run: NEXO_SHIELD_DOCKER_IMAGE=nexo-shield:local python -m pytest -q tests/test_shield_docker.py
      - name: Build validation image
        run: docker/shield/build.sh validation
      - name: Run security suites inside Docker
        run: docker compose -f docker/shield/compose.yaml run --rm validation
      - name: Require kernel isolation inside Docker
        run: docker compose -f docker/shield/compose.yaml run --rm validation --require-linux
