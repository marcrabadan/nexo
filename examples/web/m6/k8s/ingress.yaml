# Set the host, ingressClassName and a browser-trusted TLS Secret for your cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexo-m6
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [nexo-m6.example.test]
      secretName: nexo-m6-tls
  rules:
    - host: nexo-m6.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexo-m6
                port: {name: http}
