apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexo-m6
spec:
  replicas: 1
  selector:
    matchLabels: {app: nexo-m6}
  template:
    metadata:
      labels: {app: nexo-m6}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: nexo-m6-e2e-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: "100m", memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: nexo-m6
spec:
  selector: {app: nexo-m6}
  ports:
    - {name: http, port: 8080, targetPort: http}
